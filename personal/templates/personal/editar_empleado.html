{% extends 'core/base.html' %}

{% block title %}Editar empleado — Beach Club{% endblock %}

{% block content %}

<div class="bc-section">
  <div class="bc-section-title">Editar — {{ empleado.nombre }} {{ empleado.apellidos }}</div>

  <div class="bc-card bc-card-form">
    <form method="post">
      {% csrf_token %}

      <div class="bc-form-grid">
        <div class="bc-form-group">
          <label>Nombre *</label>
          <input type="text" name="nombre" value="{{ empleado.nombre }}" required autofocus>
        </div>
        <div class="bc-form-group">
          <label>Apellidos</label>
          <input type="text" name="apellidos" value="{{ empleado.apellidos }}">
        </div>
      </div>

      <div class="bc-form-group bc-mt-12">
        <label>Rol *</label>
        <select name="rol" required>
          <option value="">— Seleccionar —</option>
          {% for value, label in roles %}
          <option value="{{ value }}" {% if empleado.rol == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="bc-form-grid bc-mt-12">
        <div class="bc-form-group">
          <label>Teléfono</label>
          <input type="text" name="telefono" value="{{ empleado.telefono }}">
        </div>
        <div class="bc-form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ empleado.email }}">
        </div>
      </div>

      <div class="bc-form-group bc-mt-12">
        <label>Fecha de nacimiento</label>
        <input type="date" name="fecha_nacimiento" value="{{ empleado.fecha_nacimiento|date:'Y-m-d' }}">
      </div>

      <div class="bc-form-grid bc-mt-12">
        <div class="bc-form-group">
          <label>Tipo de contrato</label>
          <select name="tipo_contrato">
            <option value="">— Sin especificar —</option>
            {% for value, label in contratos %}
            <option value="{{ value }}" {% if empleado.tipo_contrato == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="bc-form-group">
          <label>Vencimiento contrato</label>
          <input type="date" name="fecha_vencimiento" value="{{ empleado.fecha_vencimiento|date:'Y-m-d' }}">
        </div>
      </div>

      <div class="bc-btn-row">
        <button type="submit" class="bc-btn bc-btn-primary">
          <i class="ti ti-device-floppy"></i> Guardar
        </button>
        <a href="{% url 'lista_empleados' %}" class="bc-btn">Cancelar</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
