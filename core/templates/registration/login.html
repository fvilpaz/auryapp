{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Beach Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bc-login-page">

  <div class="bc-login-wrap">
    <div class="bc-login-card">

      <div class="bc-login-header">
        <img src="{% static 'img/fondo_login.webp' %}" alt="Beach Club" class="bc-login-hero-img">
        <h1 class="bc-login-title">Beach Club</h1>
        <p class="bc-login-subtitle" id="saludo"></p>
      </div>

      {% if form.errors %}
      <div class="bc-login-error">
        <i class="ti ti-alert-circle"></i>
        Usuario o contraseña incorrectos
      </div>
      {% endif %}

      <form method="post" class="bc-login-form">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

        <div class="bc-login-field">
          <label for="id_username" class="bc-login-label">
            <i class="ti ti-user"></i> Usuario
          </label>
          <input class="bc-login-input" type="text" name="username" id="id_username"
                 placeholder="Tu usuario" autocomplete="username" autofocus required>
        </div>

        <div class="bc-login-field">
          <label for="id_password" class="bc-login-label">
            <i class="ti ti-lock"></i> Contraseña
          </label>
          <input class="bc-login-input" type="password" name="password" id="id_password"
                 placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>

        <button type="submit" class="bc-btn bc-btn-primary bc-login-btn">
          <i class="ti ti-login"></i> Entrar
        </button>
      </form>

      <div class="bc-login-footer">
        <span class="bc-login-footer-text">Acceso exclusivo para personal autorizado</span>
      </div>

      <div class="bc-login-credit">
        <span>Desarrollado por <strong>Fernando Vilas Paz</strong></span>
        <div class="bc-login-credit-links">
          <a href="https://github.com/fvilpaz" target="_blank" rel="noopener">
            <i class="ti ti-brand-github"></i> GitHub
          </a>
          <a href="https://www.linkedin.com/in/fernando-vilas-paz-1626901a9" target="_blank" rel="noopener">
            <i class="ti ti-brand-linkedin"></i> LinkedIn
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function() {
      var h = new Date().getHours();
      var saludo;
      if (h >= 6 && h < 14)       saludo = 'Buenos días';
      else if (h >= 14 && h < 21) saludo = 'Buenas tardes';
      else                         saludo = 'Buenas noches';
      document.getElementById('saludo').textContent = saludo;
    })();
  </script>

</body>
</html>
