{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Beach Club{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <nav class="bc-navbar">
    <a href="/" class="bc-navbar-brand">
      <div class="bc-navbar-avatar">BC</div>
      Beach Club
    </a>
    <ul class="bc-navbar-nav">
      <li><a href="/" title="Dashboard">&#9632;</a></li>
      <li><a href="#" title="Eventos">&#128197;</a></li>
      <li><a href="#" title="Tareas">&#9989;</a></li>
      <li><a href="#" title="Personal">&#128100;</a></li>
    </ul>
    <div class="bc-navbar-user">AB</div>
  </nav>

  <main class="bc-page">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/functions.js' %}"></script>
  
<script>
  window.BC = {
    urls: {
      eventos_json: "{% url 'eventos_json' %}",
    }
  };
</script>
<script src="{% static 'js/functions.js' %}"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
