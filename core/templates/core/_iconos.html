{% load static %}
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/icons/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/icons/apple-touch-icon.png' %}">
  <meta name="theme-color" content="#1a6fc4">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    // PWA/TWA: registra el service worker y busca versión nueva al volver a la app.
    // Nunca recarga la página por su cuenta (no se pierde lo que se esté editando);
    // lo nuevo se ve en la siguiente página que se abra.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function () {});
      });
    }
  </script>
